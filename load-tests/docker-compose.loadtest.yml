# Навантажувальний контур лаби 5 (ADR 0045). Підключається поверх стандартного стеку:
#   docker compose -f docker-compose.yml -f load-tests/docker-compose.loadtest.yml up -d --build
#   docker compose -f docker-compose.yml -f load-tests/docker-compose.loadtest.yml run --rm k6 run scenario-a-read.js
# Стандартний `docker compose up` цей файл не чіпає.
#
# Навіщо ліміти: без них контейнери ділять усі 24 ядра машини, і результат залежить від того, що ще працює поруч
# (у лабі 3 один backend сам забирав 5.6 ядра, і scale-out не було видно). Тут кожен компонент — «окремий сервер» з
# фіксованими ядрами (cpuset) і пам'яттю, а генератор навантаження (k6) — на власних ядрах, які SUT не використовує.
#
# Розкладка ядер (24 vCPU у Docker Desktop / WSL2):
#   0-1 lb · 2-3 backend-1 · 4-5 backend-2 · 6-7 backend-3 · 8-11 postgres · 12 redis · 16-23 k6
x-sut-backend: &sut-backend
  cpus: 2.0
  mem_limit: 1g

services:
  lb:
    cpuset: "0-1"
    cpus: 2.0
    mem_limit: 256m

  backend-1:
    <<: *sut-backend
    cpuset: "2-3"

  backend-2:
    <<: *sut-backend
    cpuset: "4-5"

  backend-3:
    <<: *sut-backend
    cpuset: "6-7"

  postgres:
    cpuset: "8-11"
    cpus: 4.0
    mem_limit: 2g

  redis:
    cpuset: "12"
    cpus: 1.0
    mem_limit: 256m

  # Генератор навантаження. Профіль loadtest — не стартує з `up`, лише `run --rm k6 ...`.
  k6:
    image: grafana/k6:1.3.0
    profiles: ["loadtest"]
    cpuset: "16-23"
    cpus: 8.0
    mem_limit: 2g
    working_dir: /scripts
    volumes:
      - ./load-tests:/scripts
    environment:
      # Усередині мережі Docker: без проброса порту Windows → WSL2, який сам додає затримку і ділить CPU хоста.
      BASE_URL: http://lb:8080
      # Підсумок кожного прогону у JSON — з нього будуються таблиці й графіки (load-tests/report.py).
      K6_SUMMARY_DIR: /scripts/results
    networks:
      - app-network
