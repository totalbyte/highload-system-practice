# Навантажувальний контур лаби 6 на машині з 8 логічними потоками (ADR 0053). Те саме, що docker-compose.loadtest.yml
# (ADR 0045), але розкладка під 8 потоків: 24-ядерна не стартує на цій машині.
#   OVERLAY=load-tests/docker-compose.loadtest-8cpu.yml bash load-tests/run.sh scenario-a-read мітка
#
# Кожен вузол БД отримує однаковий ресурс: так порівняння Single Primary і Primary + Replica показує ефект другого вузла.
# Потоки 0-1, 2-3, 4-5, 6-7 — логічні пари одних фізичних ядер (i5-9300H), тож ізоляція неповна; це обмеження записане у звіті.
#   0 backend-1 · 1 backend-2 · 2 postgres · 3 postgres-replica · 4 lb · 5 redis, web, pgadmin · 6-7 k6
services:
  lb:
    cpuset: "4"
    cpus: 1.0
    mem_limit: 256m

  backend-1:
    cpuset: "0"
    cpus: 1.0
    mem_limit: 512m

  backend-2:
    cpuset: "1"
    cpus: 1.0
    mem_limit: 512m

  postgres:
    cpuset: "2"
    cpus: 1.0
    mem_limit: 1g

  postgres-replica:
    cpuset: "3"
    cpus: 1.0
    mem_limit: 1g

  redis:
    cpuset: "5"
    mem_limit: 128m

  # Не беруть участі у прогонах, але не повинні забирати потоки компонентів, що вимірюються.
  web:
    cpuset: "5"
    mem_limit: 64m

  pgadmin:
    cpuset: "5"
    mem_limit: 384m

  # Генератор навантаження. Профіль loadtest — не стартує з `up`, лише `run --rm k6 ...`.
  k6:
    image: grafana/k6:1.3.0
    profiles: ["loadtest"]
    cpuset: "6-7"
    cpus: 2.0
    mem_limit: 1536m
    working_dir: /scripts
    volumes:
      - ./load-tests:/scripts
    environment:
      BASE_URL: http://lb:8080
      K6_SUMMARY_DIR: /scripts/results
    networks:
      - app-network
