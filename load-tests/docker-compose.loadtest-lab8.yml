# Навантажувальний контур лаби 8 (ADR 0060) на машині з 8 логічними потоками, як у лабі 6 (ADR 0053), плюс Shard B.
#   bash load-tests/stampede.sh None burst
#
# Промах результатів читає лише Primary свого шарду (ADR 0050), тож кожен Primary — окреме ядро: Thundering Herd видно
# по черзі в одному вузлі БД, а не розмазаним по всій машині. Репліки в прогонах не працюють і ділять ядро з Redis.
#   0 backend-1 · 1 backend-2 · 2 postgres (Shard A) · 3 postgres-shard-b · 4 lb · 5 redis, репліки, web, pgadmin · 6-7 k6
services:
  lb:
    cpuset: "4"
    cpus: 1.0
    mem_limit: 256m

  backend-1:
    cpuset: "0"
    cpus: 1.0
    mem_limit: 512m

  backend-2:
    cpuset: "1"
    cpus: 1.0
    mem_limit: 512m

  postgres:
    cpuset: "2"
    cpus: 1.0
    mem_limit: 1g

  postgres-shard-b:
    cpuset: "3"
    cpus: 1.0
    mem_limit: 1g

  postgres-replica:
    cpuset: "5"
    mem_limit: 512m

  postgres-shard-b-replica:
    cpuset: "5"
    mem_limit: 512m

  redis:
    cpuset: "5"
    mem_limit: 128m

  web:
    cpuset: "5"
    mem_limit: 64m

  pgadmin:
    cpuset: "5"
    mem_limit: 384m

  # Генератор навантаження. Профіль loadtest — не стартує з `up`, лише `run --rm k6 ...`.
  k6:
    image: grafana/k6:1.3.0
    profiles: ["loadtest"]
    cpuset: "6-7"
    cpus: 2.0
    mem_limit: 1536m
    working_dir: /scripts
    volumes:
      - ./load-tests:/scripts
    environment:
      BASE_URL: http://lb:8080
      K6_SUMMARY_DIR: /scripts/results
    networks:
      - app-network
