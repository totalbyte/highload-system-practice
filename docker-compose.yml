name: polling-platform

x-backend: &backend
  build:
    context: .
    dockerfile: src/PollingPlatform.Api/Dockerfile
  image: polling-platform/backend:latest
  environment: &backend-environment
    ASPNETCORE_ENVIRONMENT: Production
    ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-polling};Username=${POSTGRES_USER:-polling};Password=${POSTGRES_PASSWORD:-polling};Gss Encryption Mode=Disable;Maximum Pool Size=${DB_MAX_POOL_SIZE:-30}"
    # Читання, що допускають відставання (лаба 6, ADR 0050). У репліки свій пул і той самий бюджет: instances × pool ≤ 90.
    ConnectionStrings__PostgresReplica: "Host=postgres-replica;Port=5432;Database=${POSTGRES_DB:-polling};Username=${POSTGRES_USER:-polling};Password=${POSTGRES_PASSWORD:-polling};Gss Encryption Mode=Disable;Maximum Pool Size=${DB_MAX_POOL_SIZE:-30}"
    # false — усі читання на Primary: конфігурація Single Primary для порівняння (лаба 6, 2.6).
    ReadReplica__Enabled: ${READ_REPLICA_ENABLED:-true}
    # Скільки секунд після запису користувач читає з Primary (Read-After-Write, ADR 0051); 0 — вимкнено, для демо.
    ReadAfterWrite__StickyTtlSeconds: ${STICKY_TTL_SECONDS:-5}
    ConnectionStrings__Redis: "redis:6379,abortConnect=false"
    Jwt__Secret: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
    Jwt__LifetimeMinutes: ${JWT_LIFETIME_MINUTES:-60}
    Seed__Enabled: ${SEED_ENABLED:-true}
    Seed__Users: ${SEED_USERS:-500}
    Seed__Polls: ${SEED_POLLS:-50}
    # Debug — рядок у лозі backend на кожен HIT / MISS / STORE / INVALIDATE кешу результатів (лаба 4, демо).
    Logging__LogLevel__PollingPlatform.Api.Results: ${CACHE_LOG_LEVEL:-Information}
    # false — читання результатів без кешу, прямо з БД (лаба 5: порівняння cache off / on, ADR 0046).
    ResultsCache__Enabled: ${RESULTS_CACHE_ENABLED:-true}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - app-network

services:
  # Єдина точка входу (лаба 3): назовні відкритий лише балансувальник, backend-и — тільки всередині app-network.
  lb:
    image: haproxy:3.4.6-alpine
    ports:
      - "${LB_PORT:-8080}:8080"
      - "${LB_STATS_PORT:-8404}:8404"
    volumes:
      # Каталог, а не окремий файл: редактори на Windows замінюють файл новим, і змонтований файл не оновився б.
      - ./haproxy:/usr/local/etc/haproxy:ro
    depends_on:
      - backend-1
      - backend-2
      - web
    restart: unless-stopped
    networks:
      - app-network

  # Веб-інтерфейс: nginx зі зібраним React-застосунком. Портів назовні немає — сторінки віддає той самий HAProxy
  # на :8080 (усе, крім /api, /swagger, /health), тож браузер ходить до API з того самого origin, без CORS.
  web:
    build:
      context: ./frontend
    image: polling-platform/web:latest
    restart: unless-stopped
    networks:
      - app-network

  backend-1:
    <<: *backend
    environment:
      <<: *backend-environment
      INSTANCE_ID: backend-1

  backend-2:
    <<: *backend
    environment:
      <<: *backend-environment
      INSTANCE_ID: backend-2

  # Третій інстанс для scale-out: `docker compose --profile scale up -d`. Балансувальник підхоплює його сам.
  backend-3:
    <<: *backend
    profiles: ["scale"]
    environment:
      <<: *backend-environment
      INSTANCE_ID: backend-3

  # Primary: приймає всі записи (лаба 6, ADR 0049). Реплікація асинхронна: synchronous_standby_names порожній, тож
  # COMMIT не чекає репліку. max_slot_wal_keep_size — межа WAL для слота: якщо репліка довго лежить, вона втратить
  # слот і потребуватиме нового pg_basebackup, зате диск Primary не заповниться.
  postgres:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=1GB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polling}
      POSTGRES_USER: ${POSTGRES_USER:-polling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polling}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  # Replica: read-only копія, яка відтворює WAL Primary (лаба 6, ADR 0049). На порожньому томі сама робить
  # pg_basebackup. hot_standby_feedback: Primary не прибирає рядки, які ще читає репліка, — інакше довгі читання
  # скасовувалися б через конфлікт із відтворенням WAL.
  postgres-replica:
    image: postgres:17-alpine
    entrypoint: ["sh", "/usr/local/bin/replica-entrypoint.sh"]
    command:
      - postgres
      - -c
      - hot_standby=on
      - -c
      - hot_standby_feedback=on
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polling}
      POSTGRES_USER: ${POSTGRES_USER:-polling}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    ports:
      - "${POSTGRES_REPLICA_PORT:-5435}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:8.10.2-alpine
    # Чистий кеш: без збереження на диск (лаба 4, ADR 0043). Інакше після `docker compose stop/start redis` він
    # завантажив би з dump.rdb записи, інвалідацію яких пропустив, поки лежав, — застарілі результати після збою.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  adminer:
    image: adminer:latest
    profiles: ["tools"]
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:9.17.0
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@polling.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  pgdata-replica:
  pgadmin-data:

configs:
  pgadmin_servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "polling (docker)",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB:-polling}",
            "Username": "${POSTGRES_USER:-polling}",
            "SSLMode": "prefer"
          }
        }
      }
