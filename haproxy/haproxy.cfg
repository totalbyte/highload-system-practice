# HAProxy — єдина точка входу перед пулом backend (лаба 3, ADR 0031).
# Назовні відкриті лише :8080 (API) і :8404 (сторінка статистики самого балансувальника); backend-и доступні
# тільки всередині app-network. Каталог змонтовано read-only, тож зміни цього файлу підхоплюються м'яким
# перезавантаженням без перезбирання образу (команда — у docs/ai/runbook.md).

global
    # Лог у stdout контейнера: `docker compose logs lb`.
    log stdout format raw local0 info

# Docker DNS: імена backend-N резолвляться під час роботи, а не лише на старті. Так HAProxy стартує без backend-3
# (профіль scale) і сам підхоплює його, коли контейнер з'являється, а також нову IP-адресу перезапущеного вузла.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s

defaults
    mode http
    log global
    option dontlognull
    # З'єднання всередині bridge-мережі встановлюється за долі мілісекунди: 2 с — це вже мертвий вузол.
    timeout connect 2s
    # Найдовша легітимна відповідь API — 13–16 с при недоступній БД (EF-повтори, потім 503 ProblemDetails).
    # 30 с з запасом, щоб клієнт отримав нашу 503, а не 504 від балансувальника.
    timeout client  30s
    timeout server  30s
    timeout http-request 10s

frontend fe_api
    bind :8080
    # HTTP-лог: вузол (%s), код (%ST), час відповіді вузла (%Tr) і повний час (%Ta) — дані для експериментів.
    option httplog
    # X-Forwarded-For: справжня адреса клієнта для backend-ів.
    option forwardfor
    # Голосування — окрема секція з повторами вже відправленого запиту (ADR 0037, Учасник 2).
    use_backend be_vote if METH_POST { path_reg ^/api/polls/[0-9]+/vote$ }
    default_backend be_api

backend be_api
    # Алгоритм і ваги перемикає `bash scripts/lb-algorithm.sh roundrobin|leastconn|weighted|source` (ADR 0034):
    # він змінює рядок balance і weight на серверах, перевіряє конфіг і м'яко перезавантажує HAProxy.
    # weighted = roundrobin з вагою 3 на backend-1 (імітація потужнішого вузла).
    balance roundrobin

    # Активна перевірка (ADR 0033): HAProxy сам питає /health кожного вузла. /health = SELECT 1 до PostgreSQL з
    # таймаутом 2 с, 200 або 503 (ADR 0019); Redis навмисно не перевіряє (ADR 0021). Вузол без БД (503) — degraded,
    # випадає з пулу. timeout check 3 с — більше за 2 с, з якими /health відповідає, коли БД недоступна.
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    timeout check 3s

    # Повтори. Не вдалося з'єднатися — запит ще не відправлено, тож повтор безпечний для будь-якого методу;
    # redispatch 1 — кожен повтор іде на інший вузол, а не в той самий мертвий.
    retries 2
    option redispatch 1
    # Обрив уже відправленого запиту (вузол убили посеред відповіді) повторюємо лише для GET: читання ідемпотентне,
    # а повтор POST /api/polls створив би друге опитування. Повтори голосування — окрема секція Учасника 2 (П2-4).
    # Коди 5xx навмисно не повторюємо: наш 503 при недоступній БД / Redis — чесна відповідь API, не відмова вузла.
    retry-on conn-failure empty-response
    http-request disable-l7-retry if !METH_GET

    # init-addr none: адреси заповнює лише резолвер під час роботи. Вузол без DNS-запису (backend-3 не запущено)
    # не ламає старт, а чекає в MAINT, поки резолвер його не знайде. Без libc-резолвінгу на старті: пошук
    # неіснуючого імені через Docker DNS триває ~6 с, і на стільки ж затягувалося б кожне перезавантаження конфігу.
    # inter 2s, fall 2, rise 2: вузол виключається після 2 невдалих перевірок поспіль і повертається після 2 вдалих;
    # fastinter 500ms — частіші перевірки, коли стан вузла саме змінюється (≈ 2.5 с замість 4 с на виявлення).
    # Пасивна перевірка — observe layer4: перша ж помилка з'єднання на живому запиті одразу виключає вузол.
    # Лише layer4: layer7 (5xx на живих запитах) вимкнув би весь пул, коли API чесно віддає 503 через Redis.
    default-server init-addr none resolvers docker check inter 2s fastinter 500ms fall 2 rise 2 observe layer4 error-limit 1 on-error mark-down
    server backend-1 backend-1:8080 weight 1
    server backend-2 backend-2:8080 weight 1
    server backend-3 backend-3:8080 weight 1

# POST /api/polls/{id}/vote (ADR 0037). Відрізняється від be_api одним: обрив уже відправленого голосу (вузол убили
# посеред обробки) повторюється на іншому вузлі. Це безпечно саме для голосу: голос і лічильник — одна транзакція
# (ADR 0014), тож на вбитому вузлі вона або закомічена цілком, або відкочена; повтор після коміту дає 409 завдяки
# UNIQUE(poll_id, user_id), повтор зміни голосу на той самий варіант — 200 без змін. Подвійного голосу не буває.
# 5xx не повторюємо, як і в be_api: 503 при недоступній БД / Redis — чесна відповідь API (пастка 503, ADR 0033).
# response-timeout теж ні: 30 с без відповіді — це повільна БД, а не мертвий вузол, і повтор лише подвоїв би
# навантаження на неї.
backend be_vote
    # Рядок balance і ваги перемикає той самий scripts/lb-algorithm.sh — обидві секції завжди з одним алгоритмом.
    balance roundrobin
    retries 2
    option redispatch 1
    retry-on conn-failure empty-response
    # Повторити можна лише запит, який HAProxy тримає цілком у буфері. Без цієї опції він починає пересилати
    # заголовки до приходу тіла (клієнт часто шле їх окремими пакетами), і такий голос уже не відтворити: у логах
    # були 502 `SH--` з 0 повторів. Тіло голосу — кілька десятків байт, буферизація нічого не коштує.
    option http-buffer-request
    # Ті самі перевірки, що в be_api, але власні, а не `track be_api/...`: при track у секції немає пасивної перевірки
    # (observe), і вбитий вузол виключався лише активними перевірками за ≈ 6 с — кожен голос, що потрапив на нього
    # за цей час, чекав 2 с timeout connect. Зі своїм observe layer4 перша ж помилка з'єднання голосу виключає вузол
    # за ≈ 1 с (ADR 0037). Ціна — удвічі більше запитів /health (2 на вузол кожні 2 с), для SELECT 1 це копійки.
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    timeout check 3s
    default-server init-addr none resolvers docker check inter 2s fastinter 500ms fall 2 rise 2 observe layer4 error-limit 1 on-error mark-down
    server backend-1 backend-1:8080 weight 1
    server backend-2 backend-2:8080 weight 1
    server backend-3 backend-3:8080 weight 1

listen stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 2s
    # Сторінка оновлюється кожні 2 с — не засмічуємо нею лог запитів.
    no log
