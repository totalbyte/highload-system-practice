# Прямий доступ до окремих інстансів — лише для налагодження та історичних демо лаби 2 (наприклад,
# scripts/results-cache-demo.py). У стандартному стеку backend-и портів назовні не мають (п. 2.2 методички, ADR 0031),
# тому цей файл ніколи не підключається за замовчуванням:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d     # + порти 8091 / 8092 (/ 8093)
#   docker compose up -d                                                      # назад до стандартного стеку
# Порти слухають лише 127.0.0.1. backend-3 отримує 8093, коли запущений з --profile scale.
services:
  backend-1:
    ports:
      - "127.0.0.1:8091:8080"
  backend-2:
    ports:
      - "127.0.0.1:8092:8080"
  backend-3:
    ports:
      - "127.0.0.1:8093:8080"
