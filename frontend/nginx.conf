# Статика веб-інтерфейсу. Сюди HAProxy шле все, крім /api, /swagger і /health (вони йдуть на backend-и).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Файли зі збірки Vite мають хеш у назві — їх можна кешувати назавжди.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: будь-який шлях (/polls/12, /favorites) віддає index.html, маршрут розбирає React Router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
